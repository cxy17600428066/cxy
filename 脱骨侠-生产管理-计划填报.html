<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>脱骨侠 · 生产管理 / 计划填报</title><style>
:root{--bg:#f4f6f8;--ink:#182626;--muted:#738080;--green:#176e5b;--line:#e5eaea;--orange:#db733c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 'Microsoft YaHei',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;border-radius:7px;padding:8px 14px;color:var(--ink)}button:hover{border-color:var(--green);color:var(--green)}button.primary{background:var(--green);color:white;border-color:var(--green)}button:disabled{opacity:.45;cursor:not-allowed}input,select,textarea{border:1px solid #dbe3e2;border-radius:6px;padding:8px;background:white;color:var(--ink)}textarea{width:100%;resize:vertical}.app{display:flex;min-height:100vh}.side{width:220px;background:#142e2b;color:#c2d0cd;padding:28px 18px;position:fixed;inset:0 auto 0 0}.brand{font-size:25px;color:white;font-weight:900;letter-spacing:3px}.brand small{display:block;font-size:11px;letter-spacing:3px;color:#8aa8a1;margin-top:3px}.sys{margin:34px 10px 12px;font-size:11px;letter-spacing:2px;color:#77988e}.nav{padding:11px 14px;margin:5px 0;border-radius:7px;cursor:pointer}.nav.active{background:#285046;color:white}.nav span{float:right;font-size:11px}.phase{position:absolute;bottom:28px;font-size:12px;padding:14px;color:#99b0aa;border:1px solid #355149;border-radius:8px;width:184px}main{margin-left:220px;width:calc(100% - 220px)}header{height:76px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px}.crumb{color:var(--muted);font-size:12px}.switch{display:flex;align-items:center;gap:12px}.avatar{border-radius:50%;background:#e5f0eb;color:var(--green);width:34px;height:34px;display:grid;place-items:center}.body{padding:28px 32px;max-width:1600px;margin:auto}h1{margin:0;font-size:27px;letter-spacing:-.6px}h2{font-size:17px;margin:0}h3{font-size:14px;margin:0}.muted{color:var(--muted);font-size:12px}.heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.badge{display:inline-block;font-size:11px;padding:3px 8px;border-radius:4px;color:var(--green);background:#e7f3ec}.badge.warn{background:#fff0e1;color:#ab6429}.badge.gray{background:#edf0f2;color:#657579}.notice{background:#ecf4f0;border:1px solid #d5e7de;border-radius:8px;padding:14px 18px;margin:18px 0;display:flex;gap:12px}.notice b{color:var(--green)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:20px 0}.stat,.card{background:white;border:1px solid var(--line);border-radius:10px}.stat{padding:18px 20px}.stat .value{font-size:29px;font-weight:700;line-height:1.5}.stat .unit{font-size:12px;color:var(--muted);margin-left:5px}.stat .sub{font-size:11px;color:var(--muted)}.card{margin-bottom:18px;overflow:hidden}.cardhead{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}.steps{display:flex;padding:20px 22px;gap:10px}.step{flex:1;border-top:3px solid #d9e5df;padding-top:10px;font-size:12px}.step.done{border-color:var(--green)}.step b{display:block}.toolbar{padding:16px 22px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.toolbar .push{margin-left:auto}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;text-align:left}th{background:#f8faf9;font-size:11px;color:#6b7d76;font-weight:500}th,td{padding:14px 20px;border-bottom:1px solid #edf0ef}td{font-size:12px}td strong{font-size:13px}td small{display:block;color:var(--muted);font-size:11px}.num{text-align:right;font-variant-numeric:tabular-nums}.link{border:0;background:none;color:var(--green);padding:0 6px;font-size:12px}.foot{padding:14px 22px;font-size:12px;display:flex;justify-content:space-between;color:var(--muted)}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}.padded{padding:20px 22px}.row{display:flex;justify-content:space-between;gap:20px;margin:12px 0}.bar{height:8px;background:#edf1ef;border-radius:5px;overflow:hidden;margin:7px 0 18px}.bar i{display:block;height:100%;background:#4f967a}.empty{text-align:center;padding:45px;color:var(--muted)}.modal{position:fixed;inset:0;background:#10272377;display:flex;align-items:center;justify-content:center;z-index:10;padding:20px}.dialog{background:white;border-radius:12px;width:700px;max-height:92vh;overflow:auto;box-shadow:0 20px 90px #10272333}.dialoghead{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.dialogbody{padding:20px 24px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field label{display:block;font-size:12px;margin-bottom:6px}.field input,.field select{width:100%}.dialogfoot{padding:16px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}.error{color:#bc4b3b;font-size:12px;margin-top:10px}.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#163e34;color:white;padding:12px 25px;border-radius:8px;z-index:30}.rules li{margin-bottom:10px}.tag{font-size:11px;color:#85958d;padding:2px 6px;border:1px solid var(--line);border-radius:4px}.risk{color:#bd7438}.mobile{display:none}@media(max-width:1000px){.side{width:170px}.phase{width:134px}main{margin-left:170px;width:calc(100% - 170px)}.body{padding:20px}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}header{padding:0 20px}.steps{flex-wrap:wrap}.step{min-width:120px}}@media(max-width:650px){.side{display:none}main{margin:0;width:100%}header{height:auto;padding:14px;display:block}.switch{margin-top:10px}.body{padding:16px}.heading{align-items:start;gap:12px}h1{font-size:23px}.stats{gap:8px}.stat{padding:12px}.cardhead{padding:14px}.mobile{display:block;margin:10px 0}.formgrid{grid-template-columns:1fr}.crumb{font-size:11px}}
</style></head><body><div class="app"><aside class="side"><div class="brand">脱骨侠<small>生产管理 · MES</small></div><div class="sys">需求与计划</div><div class="nav active" data-page="work" onclick="go('work')">▦　计划填报 <span>01</span></div><div class="nav" data-page="orders" onclick="go('orders')">≡　订单参照</div><div class="nav" data-page="rules" onclick="go('rules')">◎　角色与流程</div><div class="sys">后续阶段</div><div class="nav muted">生产排程 <span>待建设</span></div><div class="nav muted">生产执行 <span>待建设</span></div><div class="phase">第一阶段 · 销售需求计划<br><span style="color:#d1ded9">让需求有来源，让生产有依据。</span></div></aside><main><header><div><b>生产管理</b><div class="crumb">需求管理 / 计划填报 / 2026 年第 43 周</div></div><div class="switch"><span class="badge warn">交互原型 · 示例数据</span><select id="role" aria-label="切换演示角色" onchange="changeRole()"><option value="sales">销售 · 湖北省区 / 李晓</option><option value="region">审核 · 华中大区 / 王经理</option><option value="center">审核 · 休食中心 / 陈总监</option><option value="leader">领导 · 销售副总 / 严总</option><option value="planner">计划部门 · 刘计划</option></select><div class="avatar" id="avatar">李</div></div></header><div class="body"><select class="mobile" onchange="go(this.value)"><option value="work">计划填报</option><option value="orders">订单参照</option><option value="rules">角色与流程</option></select><div id="view"></div></div></main></div><div id="overlay"></div><div id="toast" aria-live="polite"></div>
<script>
const KEY='tgx-plan-prototype-v1';let role='sales',page='work',search='',statusFilter='all';const stages=['草稿','大区待审','中心待审','副总待审','已批准','已接收'];const initial=[
{id:1,center:'休食',region:'华中',province:'湖北',owner:'李晓',customer:'武汉悦购商贸',sku:'酸辣无骨鸡爪 200g',code:'TGX-200-SL',channel:'线下 OMS',qty:3200,order:1800,history:2600,date:'2026-10-21',note:'门店促销，预计新增需求 1,400 箱。',state:'草稿',version:1,logs:[]},
{id:2,center:'休食',region:'华中',province:'湖北',owner:'李晓',customer:'宜昌优选食品',sku:'柠檬无骨鸡爪 200g',code:'TGX-200-NM',channel:'线下 OMS',qty:1600,order:1200,history:1500,date:'2026-10-22',note:'常规补货。',state:'大区待审',version:1,logs:[{time:'10-13 09:20',who:'李晓',text:'提交销售需求 1,600 箱'}]},
{id:3,center:'休食',region:'华中',province:'湖南',owner:'赵敏',customer:'长沙好味零食',sku:'酸辣无骨鸡爪 200g',code:'TGX-200-SL',channel:'线下 OMS',qty:4200,order:2200,history:2500,date:'2026-10-22',note:'新增 30 家门店，首批铺货。',state:'大区待审',version:1,logs:[]},
{id:4,center:'休食',region:'华东',province:'浙江',owner:'周明',customer:'杭州零食仓',sku:'藤椒无骨鸡爪 200g',code:'TGX-200-TJ',channel:'线下 OMS',qty:2600,order:2000,history:2500,date:'2026-10-23',note:'常规补货。',state:'中心待审',version:1,logs:[]},
{id:5,center:'餐饮',region:'西南',province:'四川',owner:'孙悦',customer:'成都蜀味餐饮',sku:'原味无骨鸡爪 1kg',code:'TGX-1000-YW',channel:'线下 OMS',qty:1800,order:1500,history:1700,date:'2026-10-23',note:'餐饮客户周度补货。',state:'副总待审',version:1,logs:[]},
{id:6,center:'大客',region:'华东',province:'浙江',owner:'郑凯',customer:'脱骨侠旗舰店',sku:'柠檬无骨鸡爪 200g',code:'TGX-200-NM',channel:'线上 旺店通',qty:6000,order:4200,history:5200,date:'2026-10-24',note:'平台活动备货，客户按店铺映射。',state:'已批准',version:1,logs:[{time:'10-13 10:00',who:'严总',text:'批准 V1 · 6,000 箱'}]},
{id:7,center:'休食',region:'华中',province:'湖北',owner:'李晓',customer:'湖北惠选连锁',sku:'藤椒无骨鸡爪 200g',code:'TGX-200-TJ',channel:'线下 OMS',qty:2000,order:1500,history:1900,date:'2026-10-20',note:'客户已确认首批交付。',state:'已接收',version:1,adopt:2000,planNote:'按需求接收。',logs:[{time:'10-13 10:30',who:'刘计划',text:'接收 V1 · 2,000 箱'}]}
];let rows;try{rows=JSON.parse(localStorage.getItem(KEY))||structuredClone(initial)}catch(e){rows=structuredClone(initial)}
const meta={sales:{name:'李晓',title:'我的销售计划',desc:'把客户下一周需要多少货说清楚，提交给华中大区审核。',scope:'休食中心 / 华中大区 / 湖北省区 · 本人负责客户',todo:'填写客户与商品的总需求 → 检查差异 → 提交审核',stage:'草稿'},region:{name:'王经理',title:'大区审核工作台',desc:'核实华中大区的客户需求，重点处理异常增量和交付日期。',scope:'休食中心 / 华中大区 · 所辖省区',todo:'检查需求依据 → 通过至中心，或说明原因退回销售',stage:'大区待审'},center:{name:'陈总监',title:'中心审核工作台',desc:'统一休食中心各大区的需求口径，确认促销和增长合理性。',scope:'休食中心 · 所有大区与省区',todo:'检查大区已审需求 → 通过至严总，或退回销售重新填报',stage:'中心待审'},leader:{name:'严总',title:'销售需求总览',desc:'看清各中心需求结构与风险，批准可交给计划部门的销售需求。',scope:'全公司 · 休食 / 餐饮 / 大客',todo:'审核中心已审需求 → 批准并锁定版本，或退回销售',stage:'副总待审'},planner:{name:'刘计划',title:'需求接收工作台',desc:'把已批准销售需求转为计划输入，识别交期与供给缺口。',scope:'全公司 · 只接收已批准需求',todo:'按 SKU 和交期汇总 → 记录采用量与差异原因 → 接收版本',stage:'已批准'}};
function visible(){return rows.filter(r=>role==='sales'?r.owner==='李晓':role==='region'?r.center==='休食'&&r.region==='华中':role==='center'?r.center==='休食':true)}function save(){try{localStorage.setItem(KEY,JSON.stringify(rows))}catch(e){toast('浏览器未允许保存；本次会话仍可演示。')}}function fmt(n){return Number(n).toLocaleString('zh-CN')}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(t){document.getElementById('toast').innerHTML='<div class="toast">'+esc(t)+'</div>';setTimeout(()=>document.getElementById('toast').innerHTML='',3200)}function go(p){page=p;render()}function changeRole(){role=document.getElementById('role').value;search='';statusFilter='all';render()}function badge(s){return '<span class="badge '+(s.includes('待审')||s==='已退回'?'warn':s==='草稿'?'gray':'')+'">'+s+'</span>'}function sum(a,k){return a.reduce((s,r)=>s+(r[k]||0),0)}
function render(){document.querySelectorAll('[data-page]').forEach(n=>n.classList.toggle('active',n.dataset.page===page));document.getElementById('avatar').textContent=meta[role].name[0];document.getElementById('view').innerHTML=page==='rules'?rules():page==='orders'?orders():work()}
function work(){const m=meta[role],a=visible(),todo=a.filter(r=>r.state===m.stage||role==='sales'&&r.state==='已退回'),filtered=a.filter(r=>(statusFilter==='all'||r.state===statusFilter)&&(!search||(r.customer+r.sku+r.province).includes(search)));return `<div class="heading"><div><div class="muted">DEMAND PLANNING / 01</div><h1>${m.title}</h1><div class="muted">${m.desc}</div></div><div>${role==='sales'?'<button class="primary" onclick="edit()">＋ 新增客户需求</button>':'<button onclick="exportCSV()">↓ 导出当前范围</button>'}</div></div><div class="notice"><b>你现在要做</b><div>${m.todo}<div class="muted">可见范围：${m.scope}。演示切换角色会改变权限范围；正式系统由账号授权。</div></div></div><div class="stats"><div class="stat"><div class="muted">${role==='sales'?'待完成填报':'待我处理'}</div><div class="value">${todo.length}<span class="unit">条</span></div><div class="sub">${role==='sales'?'草稿 / 退回，提交后不可直接修改':m.stage+'，其他阶段只读'}</div></div><div class="stat"><div class="muted">本周销售总需求</div><div class="value">${fmt(sum(a,'qty'))}<span class="unit">箱</span></div><div class="sub">包含已下单需求，不与订单重复相加</div></div><div class="stat"><div class="muted">关联未履约订单</div><div class="value">${fmt(sum(a,'order'))}<span class="unit">箱</span></div><div class="sub">按客户、SKU、需求周去重匹配</div></div><div class="stat"><div class="muted">${role==='planner'?'已接收需求':'异常需求待关注'}</div><div class="value">${role==='planner'?a.filter(r=>r.state==='已接收').length:a.filter(r=>r.qty<r.order||r.qty>r.history*1.3).length}<span class="unit">条</span></div><div class="sub">${role==='planner'?'保留批准数量与计划采用数量':'较近 4 周均值增长超过 30% 或低于订单'}</div></div></div><div class="card"><div class="cardhead"><div><h2>2026 年第 43 周 <span class="badge gray">10.19 — 10.25</span></h2><div class="muted">填报截止 10.16 18:00 · 最终审批截止 10.17 12:00 · 示例周期</div></div><span class="tag">客户 × SKU × 需求周</span></div><div class="steps">${['销售填报','大区审核','中心审核','严总批准','计划接收'].map((x,i)=>'<div class="step '+(i===({sales:0,region:1,center:2,leader:3,planner:4}[role])?'done':'')+'"><b>0'+(i+1)+'　'+x+'</b><span class="muted">'+['填写总需求与交期','核实客户真实性','统一中心需求','锁定批准版本','形成生产计划输入'][i]+'</span></div>').join('')}</div></div>${role==='leader'||role==='planner'?summary(a):''}<div class="card"><div class="cardhead"><h2>${role==='planner'?'已批准需求与接收记录':'客户需求明细'}</h2><span class="muted">逐条流转 · 全程留痕</span></div><div class="toolbar"><input placeholder="搜索客户 / 商品 / 省区" aria-label="搜索需求" value="${esc(search)}" oninput="search=this.value;updateTable()"><select aria-label="状态筛选" onchange="statusFilter=this.value;updateTable()"><option value="all">全部状态</option>${[...stages,'已退回'].map(s=>'<option '+(statusFilter===s?'selected':'')+'>'+s+'</option>').join('')}</select><span class="muted push">数量单位：箱 · 商品箱规按主数据换算</span></div><div id="dataTable">${table(filtered)}</div></div><div class="grid"><div class="card"><div class="cardhead"><h2>操作提示</h2><span class="badge">简单三步</span></div><div class="padded"><div class="row"><b>1. 先看订单，再填总需求</b><span class="muted">订单是依据</span></div><div class="muted">例如：已有订单 1,800 箱，预计还会新增 1,400 箱，则填 3,200 箱。</div><div class="row"><b>2. 异常增量说明原因</b><span class="muted">方便一次通过</span></div><div class="muted">促销、开店、铺货等请写清依据；需求低于订单时先核实订单。</div><div class="row"><b>3. 提交后跟踪状态</b><span class="muted">不必反复问人</span></div><div class="muted">退回会显示原因；修改后生成新版本，重新走完整审批。</div></div></div><div class="card"><div class="cardhead"><h2>本阶段的业务边界</h2></div><div class="padded muted">销售负责“要多少、何时要”；审核负责“需求是否合理”；严总负责最终批准；计划部门负责“采用多少、缺口如何处理”。<br><br>本模块输出需求计划，不直接下达生产工单，不承诺交货。供给能力、库存抵扣与排程在后续生产计划环节处理。<br><br><button class="link" onclick="go('rules')">查看完整角色与流程 →</button></div></div></div><div class="muted">本地交互演示，未连接旺店通或 OMS。商品、箱规、人员、审批时点均为示例。 <button class="link" onclick="resetDemo()">重置演示数据</button></div>`}
function updateTable(){document.getElementById('dataTable').innerHTML=table(visible().filter(r=>(statusFilter==='all'||r.state===statusFilter)&&(!search||(r.customer+r.sku+r.province).includes(search))))}
function table(a){return `<div class="tablewrap"><table><thead><tr><th>客户 / 组织</th><th>商品 / 来源</th><th>需求交期</th><th class="num">销售总需求</th><th class="num">未履约订单</th><th class="num">近 4 周均值</th><th>状态 / 版本</th><th>操作</th></tr></thead><tbody>${a.map(r=>`<tr><td><strong>${esc(r.customer)}</strong><small>${r.center} / ${r.region} / ${r.province} · ${r.owner}</small></td><td>${r.sku}<small>${r.code} · ${r.channel}</small></td><td>${r.date.slice(5)}<small>第 43 周</small></td><td class="num"><strong>${fmt(r.qty)}</strong>${r.qty>r.history*1.3?'<small class="risk">↑ '+Math.round((r.qty/r.history-1)*100)+'% · 需说明</small>':''}${r.state==='已接收'?'<small>计划采用 '+fmt(r.adopt)+'</small>':''}</td><td class="num">${fmt(r.order)}</td><td class="num">${fmt(r.history)}</td><td>${badge(r.state)}<small>V${r.version}</small></td><td><button class="link" onclick="detail(${r.id})">查看</button>${role==='sales'&&['草稿','已退回'].includes(r.state)?'<button class="link" onclick="edit('+r.id+')">填报</button>':''}${r.state===meta[role].stage&&role!=='sales'?'<button class="link" onclick="detail('+r.id+')">'+(role==='planner'?'接收':'审核')+'</button>':''}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">没有符合条件的需求，请调整筛选。</td></tr>'}</tbody></table></div><div class="foot"><span>共 ${a.length} 条 · 单条需求独立审批</span><span>提交后锁定，退回后可编辑</span></div>`}
function summary(a){return `<div class="grid"><div class="card"><div class="cardhead"><h2>${role==='planner'?'按 SKU 汇总销售需求':'各中心需求分布'}</h2><span class="muted">${role==='planner'?'仅已批准 / 已接收':'当前可见全部状态'}</span></div><div class="padded">${(role==='planner'?[...new Set(a.filter(r=>['已批准','已接收'].includes(r.state)).map(r=>r.sku))]:['休食','餐饮','大客']).map(x=>{let s=sum(a.filter(r=>role==='planner'?r.sku===x&&['已批准','已接收'].includes(r.state):r.center===x),'qty');return '<div class="row"><span>'+x+'</span><b>'+fmt(s)+' 箱</b></div><div class="bar"><i style="width:'+Math.min(100,s/Math.max(1,sum(a,'qty'))*100)+'%"></i></div>'}).join('')||'<div class="muted">暂无批准需求</div>'}</div></div><div class="card"><div class="cardhead"><h2>${role==='planner'?'接收前检查':'需求风险提醒'}</h2></div><div class="padded"><div class="row"><span>需求大幅增长</span><span class="badge warn">${a.filter(r=>r.qty>r.history*1.3).length} 条</span></div><div class="row"><span>未完成最终审批</span><span>${a.filter(r=>!['已批准','已接收'].includes(r.state)).length} 条</span></div><div class="muted">${role==='planner'?'待审需求仅供预览，不计入可接收汇总。采用量低于批准量，必须说明差异，并继续跟踪缺口。':'审批只确认需求合理性。生产交期以计划部门后续评估为准。'}</div></div></div></div>`}
function modal(title,body,foot=''){document.getElementById('overlay').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="dialog" role="dialog" aria-modal="true" aria-label="${title}"><div class="dialoghead"><h2>${title}</h2><button class="link" onclick="closeModal()" aria-label="关闭">✕</button></div><div class="dialogbody">${body}</div><div class="dialogfoot">${foot||'<button onclick="closeModal()">关闭</button>'}</div></div></div>`}function closeModal(){document.getElementById('overlay').innerHTML=''}function getRow(id){return visible().find(r=>r.id===id)}
function edit(id){let r=id?getRow(id):null;if(role!=='sales'||r&&!['草稿','已退回'].includes(r.state))return;let customers=initial.filter(x=>x.owner==='李晓');modal(r?'编辑销售需求':'新增客户需求',`<div class="notice" style="margin-top:0"><div>填报 <b>2026.10.19 — 10.25</b> 的总需求，包含已有订单。<div class="muted">同一客户、商品和需求周仅一条；不同交期请填写主要需求日并在备注说明。</div></div></div><div class="formgrid"><div class="field"><label>客户 *</label><select id="fCustomer" ${r?'disabled':''}>${customers.map(c=>'<option '+(r&&r.customer===c.customer?'selected':'')+'>'+c.customer+'</option>').join('')}</select></div><div class="field"><label>商品 *</label><select id="fSku" ${r?'disabled':''}>${[...new Set(initial.map(c=>c.sku))].map(s=>'<option '+(r&&r.sku===s?'selected':'')+'>'+s+'</option>').join('')}</select></div><div class="field"><label>本周总需求（箱） *</label><input id="fQty" type="number" min="0" step="1" value="${r?r.qty:''}" placeholder="填写整数，可为 0"></div><div class="field"><label>需求交期 *</label><input id="fDate" type="date" min="2026-10-19" max="2026-10-25" value="${r?r.date:'2026-10-21'}"></div></div><div class="field" style="margin-top:18px"><label>需求依据 / 异常说明</label><textarea id="fNote" rows="3" placeholder="例如：新增门店、活动时间、预计新增量。">${esc(r?.note||'')}</textarea></div>${r?.state==='已退回'?'<div class="notice"><div><b>退回原因</b><br>'+esc(r.returnReason)+'</div></div>':''}<div class="muted" style="margin-top:12px">组织：休食 / 华中 / 湖北 · 负责人：李晓（自动带入）<br>0 需求也需说明原因。需求低于关联订单时禁止提交；先核实订单或更正需求。</div><div id="formError" class="error" role="alert"></div>`,`<button onclick="closeModal()">取消</button><button onclick="saveForm(${id||0},false)">保存草稿</button><button class="primary" onclick="saveForm(${id||0},true)">保存并提交</button>`)}
function saveForm(id,submit){const customer=document.getElementById('fCustomer').value,sku=document.getElementById('fSku').value,q=document.getElementById('fQty').value,qty=Number(q),date=document.getElementById('fDate').value,note=document.getElementById('fNote').value.trim(),old=id?getRow(id):null;const fail=t=>document.getElementById('formError').textContent=t;if(q===''||!Number.isInteger(qty)||qty<0)return fail('请填写大于或等于 0 的整数箱数。');if(date<'2026-10-19'||date>'2026-10-25')return fail('需求交期必须在 10 月 19 日至 25 日之间。');if(rows.some(r=>r.id!==id&&r.customer===customer&&r.sku===sku))return fail('这个客户与商品本周已有需求，请编辑原记录。');const source=initial.find(x=>x.customer===customer&&x.sku===sku);let order=old?.order??source?.order??0,history=old?.history??source?.history??0;if(submit&&qty<order)return fail('总需求不能低于关联未履约订单 '+fmt(order)+' 箱，请核实后调整。');if(submit&&(!qty||qty>history*1.3)&&!note)return fail('零需求或大幅增长需要填写原因。');let r=old||{id:Date.now(),center:'休食',region:'华中',province:'湖北',owner:'李晓',customer,sku,code:initial.find(x=>x.sku===sku).code,channel:'线下 OMS',order,history,version:1,logs:[]};if(old?.state==='已退回'){r.version++;r.returnReason=''}Object.assign(r,{qty,date,note,state:submit?'大区待审':'草稿'});if(!old)rows.push(r);log(r,submit?'提交 V'+r.version+' · '+fmt(qty)+' 箱':'保存草稿');save();closeModal();render();toast(submit?'已提交，等待华中大区审核。':'草稿已保存，可继续修改。')}
function log(r,text){r.logs.push({time:new Date().toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false}),who:meta[role].name,text})}
function detail(id){let r=getRow(id);if(!r)return;let can=r.state===meta[role].stage&&role!=='sales';modal('客户需求详情 · V'+r.version,`<div class="heading"><div><h2>${esc(r.customer)}</h2><div class="muted">${r.center} / ${r.region} / ${r.province} · ${r.owner}</div></div>${badge(r.state)}</div><div class="row"><span>${r.sku}</span><b>${fmt(r.qty)} 箱</b></div><div class="row"><span>需求交期</span><span>${r.date}</span></div><div class="row"><span>关联订单 / 近 4 周均值</span><span>${fmt(r.order)} / ${fmt(r.history)} 箱</span></div><div class="notice"><div><b>销售说明</b><br>${esc(r.note||'未填写')}${r.returnReason?'<br><b>退回原因：</b>'+esc(r.returnReason):''}</div></div>${r.state==='已接收'?'<div class="row"><b>计划采用 '+fmt(r.adopt)+' 箱</b><span>缺口 '+fmt(r.qty-r.adopt)+' 箱</span></div><div class="muted">'+esc(r.planNote)+'</div>':''}${can?role==='planner'?'<div class="field"><label>计划采用数量（箱） *</label><input id="adopt" type="number" min="0" max="'+r.qty+'" value="'+r.qty+'"></div><div class="field" style="margin-top:12px"><label>接收备注 / 缺口处理说明</label><textarea id="reason" rows="2" placeholder="采用量不足时，说明原因及后续跟进。"></textarea></div>':'<div class="field"><label>审核意见（退回时必填）</label><textarea id="reason" rows="3" placeholder="请告诉销售哪里需要改、为什么。"></textarea></div>':''}<div id="formError" class="error" role="alert"></div><h3 style="margin-top:22px">流转记录</h3><div class="muted">${r.logs.map(l=>'<div style="padding:8px 0;border-bottom:1px solid var(--line)">'+esc(l.time)+' · '+esc(l.who)+'<br>'+esc(l.text)+'</div>').join('')||'演示初始记录，暂无历史操作。'}</div>`,`<button onclick="closeModal()">关闭</button>${can?role==='planner'?'<button class="primary" onclick="act('+id+',\'receive\')">确认接收此版本</button>':'<button onclick="act('+id+',\'return\')">退回销售</button><button class="primary" onclick="act('+id+',\'approve\')">'+(role==='leader'?'批准并锁定版本':'通过，交给'+(role==='region'?'中心':'严总'))+'</button>':role==='sales'&&['草稿','已退回'].includes(r.state)?'<button class="primary" onclick="edit('+id+')">继续填报</button>':''}`)}
function act(id,type){let r=getRow(id);if(!r||r.state!==meta[role].stage||role==='sales')return;let reason=document.getElementById('reason').value.trim(),fail=t=>document.getElementById('formError').textContent=t;if(type==='return'){if(!reason)return fail('请写明退回原因，让销售知道怎么修改。');r.state='已退回';r.returnReason=reason;log(r,'退回销售：'+reason)}else if(type==='receive'){let val=document.getElementById('adopt').value,n=Number(val);if(val===''||!Number.isInteger(n)||n<0||n>r.qty)return fail('采用量需为 0 至 '+r.qty+' 之间的整数。');if(n!==r.qty&&!reason)return fail('采用量低于批准需求，请填写原因及缺口处理说明。');r.state='已接收';r.adopt=n;r.planNote=reason||'按批准需求接收。';log(r,'接收 V'+r.version+' · 采用 '+fmt(n)+' 箱；'+r.planNote)}else{r.state=stages[stages.indexOf(r.state)+1];log(r,(role==='leader'?'最终批准':'审核通过')+' V'+r.version+(reason?'：'+reason:''))}save();closeModal();render();toast(type==='return'?'已退回原销售，修改后重新审批。':type==='receive'?'已接收，保留销售批准量与计划采用量。':'处理完成，需求已流转到下一环节。')}
function orders(){let a=visible().filter(r=>r.order>0);return `<div class="heading"><div><div class="muted">ORDER REFERENCE</div><h1>订单参照</h1><div class="muted">订单帮助销售估计需求；订单数量不可在本模块编辑。</div></div><span class="badge warn">模拟快照 · 未实际连接</span></div><div class="grid"><div class="card padded"><h2>线下订单 · OMS</h2><div class="muted">自有系统 → 有效订单 → 客户 / SKU 映射 → 未履约数量</div><div class="row"><b>${fmt(sum(a.filter(r=>r.channel.includes('OMS')),'order'))} 箱</b><span class="badge">示例映射完成</span></div></div><div class="card padded"><h2>线上订单 · 旺店通</h2><div class="muted">渠道店铺 → 客户映射 → 商品规格换算 → 未履约数量</div><div class="row"><b>${fmt(sum(a.filter(r=>r.channel.includes('旺店通')),'order'))} 箱</b><span class="badge">示例映射完成</span></div></div></div><div class="notice"><div><b>统一口径</b>　仅参考本需求周有效、未取消、未履约的订单余量。线上店铺按客户主数据归属到省区与负责人。<div class="muted">正式对接需通过来源系统 + 原订单号 + 明细号去重；跨系统同源订单需做关联去重。映射失败和箱规缺失进入异常池，不自动计入。</div></div></div><div class="card"><div class="cardhead"><h2>已关联订单快照</h2><span class="muted">演示批次：2026-10-13 10:00</span></div><div class="tablewrap"><table><thead><tr><th>客户</th><th>商品</th><th>来源系统</th><th class="num">未履约（箱）</th><th>数据处理</th></tr></thead><tbody>${a.map(r=>'<tr><td>'+r.customer+'</td><td>'+r.sku+'</td><td>'+r.channel+'</td><td class="num">'+fmt(r.order)+'</td><td>客户 / SKU / 周 已匹配</td></tr>').join('')}</tbody></table></div></div><div class="card padded"><h2>数据异常怎么处理</h2><p class="muted">客户未映射：销售确认客户归属，由主数据管理员维护。商品未映射或箱规缺失：商品管理员维护。同步失败或数据过期：接口管理员处理；销售可保存草稿，正式系统应在提交时提示快照状态。本原型不模拟接口实时运行。</p></div>`}
function rules(){return `<div class="heading"><div><div class="muted">ROLES & RESPONSIBILITIES</div><h1>每个人该做什么</h1><div class="muted">先让销售把需求说清楚，再让计划部门拿到可信输入。</div></div></div><div class="card"><div class="cardhead"><h2>组织与数据归属</h2></div><div class="padded"><b>销售副总 · 严总 → 中心（休食 / 餐饮 / 大客） → 大区 → 省区 → 负责人 → 客户</b><p class="muted">大区支持华中、华东、华南、华北、东北、西北、西南；实际归属由组织主数据维护。客户归属与渠道分别记录：线上店铺也必须映射客户；中心不能直接由线上或线下推断。商品以 SKU 为准，口味、规格、箱规分别维护。</p></div></div><div class="card"><div class="cardhead"><h2>权限与责任矩阵</h2></div><div class="tablewrap"><table><thead><tr><th>角色</th><th>能看到</th><th>要完成</th><th>操作边界</th><th>解决的问题</th></tr></thead><tbody><tr><td>销售人员</td><td>本人负责客户与对应订单</td><td>填总需求、交期、依据；处理退回</td><td>仅编辑草稿 / 退回；不可自审</td><td>把口头预测变成可跟踪需求</td></tr><tr><td>大区审核</td><td>本大区所有省区与客户</td><td>核实客户需求、异常增长</td><td>只审大区待审；不改销售数量</td><td>过滤漏报、虚报与错误交期</td></tr><tr><td>中心审核</td><td>本中心所有大区</td><td>协调促销与大区需求合理性</td><td>只审中心待审；不跨中心审批</td><td>统一中心的需求口径</td></tr><tr><td>严总</td><td>全公司需求、风险与进度</td><td>最终批准中心已审需求</td><td>只批副总待审；不直接改量</td><td>给生产计划一个明确批准版本</td></tr><tr><td>计划部门</td><td>全公司需求；批准版本可接收</td><td>汇总 SKU、交期；记录采用量与缺口</td><td>不改销售批准量；未批准不可接收</td><td>把销售需求转成可靠计划输入</td></tr></tbody></table></div></div><div class="grid"><div class="card"><div class="cardhead"><h2>流转与版本规则</h2></div><div class="padded"><ol class="rules"><li>草稿 → 大区待审 → 中心待审 → 副总待审 → 已批准 → 已接收。</li><li>任一级审核可退回原销售，必须说明原因；修改后版本 +1，重新从大区审核。</li><li>提交后销售不可直接修改。批准或接收后变更，应新建关联原版本的变更申请，重新审批；本原型未实现变更申请。</li><li>计划采用量不足时保留批准量，记录差额与处理说明。接收不等于生产已排程。</li></ol></div></div><div class="card"><div class="cardhead"><h2>第一阶段建议确认的配置</h2><span class="badge warn">设计假设</span></div><div class="padded"><ul class="rules"><li>本原型采用周计划与三级逐条审批；实际周期、截止时间和大区名单可配置。</li><li>示例以箱为单位，不同规格的箱数仅表示出货数量；产能评估需要按 SKU 换算千克。</li><li>同一客户、SKU、需求周只保留一条活动计划；交期拆分可在后续版本增加。</li><li>生产建议量应由库存、在制、产能与交期另行计算，不能将销售需求直接当作生产量。</li></ul></div></div></div><div class="card padded"><h2>上线时的操作保护</h2><p class="muted">后端校验角色与组织范围、截止时间、状态与版本，防止越权和重复审批；记录操作人及时间。已提交记录需并发版本校验。订单同步使用快照批次与更新时间，异常数据隔离。原型仅在浏览器演示权限与流程，不能作为真实账号安全控制。</p></div>`}
function exportCSV(){const a=visible();const header=['中心','大区','省区','客户','SKU','需求周','交期','销售需求(箱)','未履约订单(箱)','状态','版本','计划采用(箱)','备注'];const lines=[header,...a.map(r=>[r.center,r.region,r.province,r.customer,r.code,'2026-W43',r.date,r.qty,r.order,r.state,r.version,r.adopt??'',r.note])];const blob=new Blob(['\ufeff'+lines.map(l=>l.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});let el=document.createElement('a');el.href=URL.createObjectURL(blob);el.download='脱骨侠-W43-'+meta[role].name+'-需求.csv';el.click();setTimeout(()=>URL.revokeObjectURL(el.href),1000);toast('已导出当前角色可见范围。')}
function resetDemo(){modal('重置演示数据','仅重置此 HTML 保存的示例需求和流转记录。你在原型里的填报与审核演示将被清除。','<button onclick="closeModal()">取消</button><button class="primary" onclick="rows=structuredClone(initial);save();closeModal();render();toast(\'演示数据已重置。\')">确认重置</button>')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();
</script></body></html>
