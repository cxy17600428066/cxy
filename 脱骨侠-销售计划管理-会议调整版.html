const roles={sales:{name:'李晓',label:'销售 · 湖北省区 / 李晓',scope:'线下 · 休食 / 华中 / 湖北 · 省区填报',todo:'填报省区月计划或客户周计划，查看销售参考，统一提交省区计划。'},online:{name:'林青',label:'线上销售 · 电商渠道 / 林青',scope:'线上 · 天猫旗舰店 / 抖音官方店',todo:'按渠道填报月计划或周计划，提交后交丹总确认。'},region:{name:'王经理',label:'审核 · 华中大区 / 王经理',scope:'线下 · 休食 / 华中 · 所辖省区',todo:'审核省区整批计划，通过后汇总提交中心；不修改销售原始值。'},center:{name:'陈总监',label:'审核 · 休食中心 / 陈总监',scope:'线下 · 休食中心 · 所有大区',todo:'核实大区汇总与审批意见，整批通过后提交严总。'},yan:{name:'严总',label:'领导 · 线下 / 严总',scope:'线下 · 全部中心、大区与省区',todo:'确认中心汇总计划；审批线下 OA 加急增减。'},dan:{name:'丹总',label:'领导 · 线上 / 丹总',scope:'线上 · 全部渠道',todo:'确认线上渠道计划；审批线上 OA 加急增减。'},planner:{name:'刘计划',label:'计划部门 · 刘计划',scope:'线上 / 线下 · 已确认计划可接收',todo:'按商品汇总已确认需求、接收版本并跟踪加急变化。'},admin:{name:'周管理员',label:'管理员 · 商品与订单关联',scope:'商品范围、周期配置、订单匹配',todo:'维护可填报商品、处理异常订单；不代替销售填报或审批。'}};
const cycles={week:{label:'2026 年第 43 周',start:'2026-10-19',end:'2026-10-25',key:'2026-W43',text:'周计划 · 每周五前完成，精确截止时点待确认'},month:{label:'2026 年 11 月',start:'2026-11-01',end:'2026-11-30',key:'2026-11',text:'月计划 · 每月 20 日填报，开放日期和截止时点待确认'}};
const productsSeed=[{code:'TGX-200-SL',name:'酸辣无骨鸡爪 200g',channels:['offline','online'],enabled:true,start:'2026-01-01',end:'2027-12-31',pack:'20 袋 / 箱',log:[]},{code:'TGX-200-NM',name:'柠檬无骨鸡爪 200g',channels:['offline','online'],enabled:true,start:'2026-01-01',end:'2027-12-31',pack:'20 袋 / 箱',log:[]},{code:'TGX-200-TJ',name:'藤椒无骨鸡爪 200g',channels:['offline'],enabled:true,start:'2026-01-01',end:'2027-12-31',pack:'20 袋 / 箱',log:[]},{code:'TGX-1000-YW',name:'原味无骨鸡爪 1kg',channels:['offline'],enabled:true,start:'2026-01-01',end:'2027-12-31',pack:'10 袋 / 箱',log:[]},{code:'TGX-200-JS',name:'旧版金酸汤无骨鸡爪 200g',channels:['offline','online'],enabled:false,start:'2025-01-01',end:'2026-09-30',pack:'20 袋 / 箱',log:[{who:'商品管理员',at:'2026-09-30',text:'停用旧包装，保留历史记录。'}]}];
function seed(){let ps=[],id=1;for(const period of ['week','month']){const mult=period==='month'?4:1;const definitions=[['offline','休食','华中','湖北','李晓','武汉悦购商贸','',0,3200,'草稿'],['offline','休食','华中','湖南','赵敏','长沙好味零食','',1,2400,'大区待审'],['offline','休食','华東','浙江','周明','杭州零食仓','',2,2600,'中心待审'],['offline','餐饮','西南','四川','孙悦','成都蜀味餐饮','',3,1800,'严总待确认'],['offline','大客','华北','北京','吴迪','京城优购连锁','',0,4100,'已确认'],['online','','','','林青','','天猫旗舰店',1,6000,'丹总待确认'],['online','','','','林青','','抖音官方店',0,4500,'已确认']];for(let d of definitions){let[type,center,region,province,owner,customer,channel,sku,q,status]=d;region=region.replace('華','华').replace('東','东');let qty=q*mult;let p={id:id++,period,type,center,region,province,owner,customer:period==='month'&&type==='offline'?'':customer,channel,sku:productsSeed[sku].code,qty,date:period==='week'?'2026-10-23':'2026-11-25',status,version:1,note:'示例需求；数量包含已下单及预计新增需求。',logs:[],versions:[{version:1,qty,reason:'初始计划'}]};ps.push(p)}}
let orders=ps.filter(p=>p.status==='已确认').map((p,i)=>({id:'ORD-'+(1001+i),line:'01',period:p.period,type:p.type,center:p.center,region:p.region,province:p.province,customer:p.customer||'京城优购连锁',channel:p.channel,sku:p.sku,date:p.period==='week'?'2026-10-22':'2026-11-12',qty:Math.round(p.qty*.82),returns:Math.round(p.qty*.04),source:p.type==='online'?'旺店通':'OMS',plan:p.id,reason:'演示自动匹配',state:'已履约'}));orders.push({id:'OMS-1099',line:'01',period:'week',type:'offline',center:'休食',region:'华中',province:'湖北',customer:'武汉悦购商贸',channel:'',sku:'TGX-200-NM',date:'2026-10-21',qty:350,returns:0,source:'OMS',plan:null,reason:'无相同客户与商品的已确认计划',state:'已履约'});return {plans:ps,products:structuredClone(productsSeed),orders,changes:[],windows:{week:'可填报',month:'未开始'},config:{monthlyOpen:'',monthlyClose:'',weeklyClose:'',overlap:'待确认',returns:'待确认'}}}
let db;try{db=JSON.parse(localStorage.getItem(KEY))||seed()}catch(e){db=seed()}let role='sales',period='week',type='offline',page='work',query='',filter='全部',dimension='商品',refRange='近1个月';
const menus=[['work','▦','计划工作台'],['changes','↗','加急调整'],['analysis','◷','达成分析与归档'],['orders','≡','订单关联'],['products','◇','可填报商品'],['rules','◎','角色与业务规则']];const stages=['草稿','大区待审','中心待审','严总待确认','丹总待确认','已确认','已接收','已退回'];
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(v){return Number(v).toLocaleString('zh-CN')}function sku(code){return db.products.find(p=>p.code===code)||{name:code,pack:'待维护'}}function kind(v){return v==='online'?'线上':'线下'}function cyc(v){return v==='month'?'月计划':'周计划'}function stamp(){return new Date().toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false})}function log(p,text){p.logs.push({who:roles[role].name,at:stamp(),text})}function persist(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('浏览器未允许本地保存，本次演示仍可继续。')}}function toast(t){document.getElementById('toast').innerHTML='<div class="toast">'+esc(t)+'</div>';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>document.getElementById('toast').innerHTML='',3000)}function canSee(p){if(role==='sales')return p.type==='offline'&&p.center==='休食'&&p.region==='华中'&&p.province==='湖北';if(role==='online')return p.type==='online'&&(p.owner==='林青'||!p.owner&&['天猫旗舰店','抖音官方店'].includes(p.channel));if(role==='region')return p.type==='offline'&&p.center==='休食'&&p.region==='华中';if(role==='center')return p.type==='offline'&&p.center==='休食';if(role==='yan')return p.type==='offline';if(role==='dan')return p.type==='online';return true}function visible(){return db.plans.filter(p=>p.period===period&&p.type===type&&canSee(p))}function get(id){return db.plans.find(p=>p.id===id&&canSee(p))}function sum(a,k='qty'){return a.reduce((s,r)=>s+(r[k]||0),0)}function writable(){return ['可填报','即将截止'].includes(db.windows[period])}function isSales(){return ['sales','online'].includes(role)}function target(){return {region:'大区待审',center:'中心待审',yan:'严总待确认',dan:'丹总待确认',planner:'已确认'}[role]}function badge(t){return '<span class="badge '+(/待|退回|截止/.test(t)?'warn':t==='草稿'||t==='未开始'?'gray':'')+'">'+esc(t)+'</span>'}function title(h,d,action=''){return '<div class="heading"><div><div class="muted">SALES DEMAND / '+cyc(period)+' / '+kind(type)+'</div><h1>'+h+'</h1><div class="muted">'+d+'</div></div>'+action+'</div>'}function stat(label,value,sub,unit=''){return `<div class="stat"><div class="muted">${label}</div><div class="value">${value}<span class="unit">${unit}</span></div><div class="sub">${sub}</div></div>`}function notice(t){return '<div class="notice"><b>你现在要做</b><div>'+t+'<div class="muted">可见范围：'+roles[role].scope+'</div></div></div>'}
function go(p){page=p;query='';filter='全部';render()}function changeRole(r){role=r;if(['online','dan'].includes(r))type='online';if(['sales','region','center','yan'].includes(r))type='offline';query='';filter='全部';render()}function setPeriod(p){period=p;query='';filter='全部';render()}function setType(t){type=t;query='';filter='全部';render()}
function render(){document.getElementById('role').innerHTML=Object.entries(roles).map(([r,m])=>'<option value="'+r+'" '+(r===role?'selected':'')+'>'+m.label+'</option>').join('');document.getElementById('avatar').textContent=roles[role].name[0];document.getElementById('nav').innerHTML=menus.map(([p,i,n])=>'<div class="nav '+(p===page?'active':'')+'" onclick="go(\''+p+'\')">'+i+'　'+n+'</div>').join('');document.getElementById('mobileNav').innerHTML=menus.map(([p,i,n])=>'<option value="'+p+'" '+(p===page?'selected':'')+'>'+n+'</option>').join('');document.getElementById('context').innerHTML=`<div class="cyclebar"><label>计划维度</label><div class="tabs"><button class="${period==='week'?'on':''}" onclick="setPeriod('week')">周计划</button><button class="${period==='month'?'on':''}" onclick="setPeriod('month')">月度计划</button></div><label>业务线</label><div class="tabs"><button class="${type==='offline'?'on':''}" onclick="setType('offline')">线下 · OMS</button><button class="${type==='online'?'on':''}" onclick="setType('online')">线上 · 旺店通</button></div><span class="push"><b>${cycles[period].label}</b>　${badge(db.windows[period])}</span><button class="smallbtn" onclick="windowDialog()">演示周期状态</button></div>`;document.getElementById('view').innerHTML=({work,changes,analysis,orders,products,rules}[page])()}
function windowDialog(){modal('周期状态与时间控制',`<div class="alert">纪要明确月计划每月 20 日填报、周计划周五前完成；精确开放与截止时点尚待确认。以下为演示状态切换，不能作为真实日历判断。</div><div class="field"><label>当前周期演示状态</label><select id="windowStatus">${['未开始','可填报','即将截止','已截止','审核中','已确认'].map(s=>'<option '+(db.windows[period]===s?'selected':'')+'>'+s+'</option>').join('')}</select></div><p class="muted">未开始：仅预览商品与销售参考。可填报 / 即将截止：允许保存和提交。已截止 / 审核中 / 已确认：禁止直接编辑和补报；审批处理不受填报截止限制。已确认计划的变更使用 OA 加急调整。未提交补报需管理员授权，原型仅说明、不模拟授权放行。</p>`, '<button onclick="closeModal()">取消</button><button class="primary" onclick="db.windows[period]=document.getElementById(\'windowStatus\').value;persist();closeModal();render();toast(\'演示周期状态已更新\')">切换状态</button>')}
function key(p,level){return p.type==='online'?p.channel:level==='province'?[p.center,p.region,p.province].join(' / '):level==='region'?[p.center,p.region].join(' / '):p.center}function group(a,fn){let m=new Map();for(let p of a){let k=fn(p);if(!m.has(k))m.set(k,[]);m.get(k).push(p)}return [...m.entries()]}function editable(p){return isSales()&&canSee(p)&&writable()&&['草稿','已退回'].includes(p.status)}
function work(){let a=visible(),pending=a.filter(p=>p.status===target()||isSales()&&['草稿','已退回'].includes(p.status)),done=a.filter(p=>['已确认','已接收'].includes(p.status));return title(isSales()?'我的销售计划':role==='planner'?'计划接收工作台':role==='admin'?'销售计划总览':'计划审核与确认',roles[role].todo,isSales()?'<button class="primary" '+(!writable()?'disabled':'')+' onclick="edit()">＋ 新增'+(type==='offline'&&period==='month'?'省区商品':type==='offline'?'客户商品':'渠道商品')+'需求</button>':'<button onclick="exportPlans()">↓ 导出可见计划</button>')+notice(roles[role].todo)+`<div class="alert">${cycles[period].text}。${db.windows[period]==='未开始'?'提前预警：本周期尚未开放，先准备客户与商品。':db.windows[period]==='即将截止'?'即将截止，请检查漏报并提交整批计划。':!writable()?'当前不可直接填报；审核与已确认计划的调整仍可按权限处理。':'当前为模拟开放状态，正式上线需配置精确时点。'}</div><div class="stats">${stat(isSales()?'待提交明细':'待我处理明细',pending.length,'整批操作会显示实际影响条数','条')}${stat('销售总需求',fmt(sum(a)),'包含已下单与预计新增需求','箱')}${stat('已确认 / 已接收',fmt(sum(done)),'只有确认版本可交计划部门','箱')}${stat('填报最小单位',type==='offline'?period==='month'?'省区 × SKU':'客户 × SKU':'渠道 × SKU',type==='offline'?'按省区 → 大区 → 中心逐级汇总':'线上计划由丹总最终确认')}</div><div class="card"><div class="cardhead"><h2>本周期流转</h2><span class="muted">原始填报值不被汇总或审批覆盖</span></div><div class="steps">${(type==='offline'?['省区填报并提交','大区汇总审核','中心汇总审核','严总确认','计划部门接收']:['渠道填报并提交','丹总确认','计划部门接收']).map((s,i)=>'<div class="step done"><b>0'+(i+1)+'　'+s+'</b></div>').join('')}</div></div>${batches(a)}<div class="card"><div class="cardhead"><h2>${type==='offline'&&period==='month'?'省区商品明细':type==='offline'?'客户商品明细':'渠道商品明细'}</h2><span class="muted">${cycles[period].start} — ${cycles[period].end} · 单位：箱</span></div><div class="toolbar"><input id="search" aria-label="搜索计划" placeholder="客户 / 省区 / 渠道 / 商品" value="${esc(query)}" oninput="query=this.value;updateList()"><select aria-label="状态筛选" onchange="filter=this.value;updateList()">${['全部',...stages].map(s=>'<option '+(s===filter?'selected':'')+'>'+s+'</option>').join('')}</select><span class="muted push">已提交只读 · 退回可改 · 确认后走调整</span></div><div id="planList">${planTable(filtered(a))}</div></div><div class="grid"><div class="card padded"><h2>填报前先看销售参考</h2><p class="muted">线下支持近 1 / 2 / 3 个月与自定义范围；线上按月、按周展示。参考不自动替代填报结果。缺失数据会明确显示“待同步 / 暂无数据”。</p><button onclick="reference()">查看历史销售与趋势 →</button></div><div class="card padded"><h2>与生产管理的交接边界</h2><p class="muted">销售计划是需求输入。计划部门按版本接收，不修改销售确认数量。库存、在制、产能与排程在后续生产计划阶段评估；确认计划不等于已承诺交货。</p></div></div><div class="muted">会议调整版 · 本地保存演示操作；未连接 OMS、旺店通和 OA。 <button class="link" onclick="resetDemo()">重置示例</button></div>`}
function batches(a){let level=isSales()?'province':role==='region'?'province':role==='center'?'region':role==='yan'?'center':'province';if(['admin','planner'].includes(role))return '';let groups=group(a,p=>key(p,level));return `<div class="card"><div class="cardhead"><h2>${isSales()?'整批提交':type==='online'?'渠道汇总确认':role==='region'?'省区汇总审核':role==='center'?'大区汇总审核':'中心汇总确认'}</h2><span class="muted">${isSales()?'提交该组织 / 渠道的全部可编辑明细':'审核当前节点整批待审明细'}</span></div><div class="tablewrap"><table><thead><tr><th>组织 / 渠道</th><th>明细数</th><th class="num">原始填报汇总</th><th>当前状态分布</th><th>操作</th></tr></thead><tbody>${groups.map(([k,ps])=>{let ids=ps.filter(p=>isSales()?editable(p):p.status===target()).map(p=>p.id);return `<tr><td><strong>${esc(k)}</strong></td><td>${ps.length} 条</td><td class="num">${fmt(sum(ps))} 箱</td><td>${group(ps,p=>p.status).map(([s,x])=>s+' '+x.length).join(' · ')}</td><td><button class="link" onclick="aggregate('${esc(k)}',${JSON.stringify(ps.map(p=>p.id))})">汇总来源</button><button class="${ids.length?'primary smallbtn':'smallbtn'}" ${!ids.length?'disabled':''} onclick="batchDialog(${JSON.stringify(ids)})">${isSales()?'提交 '+ids.length+' 条':'审核 '+ids.length+' 条'}</button></td></tr>`}).join('')||'<tr><td colspan="5" class="empty">当前角色在所选业务线没有可见计划。请切换业务线或角色。</td></tr>'}</tbody></table></div></div>`}
function filtered(a){return a.filter(p=>(filter==='全部'||p.status===filter)&&(!query||(p.customer+p.province+p.channel+sku(p.sku).name).includes(query)))}function updateList(){document.getElementById('planList').innerHTML=planTable(filtered(visible()))}
function planTable(a){return `<div class="tablewrap"><table><thead><tr><th>填报对象 / 组织</th><th>商品 / 箱规</th><th>需求交期</th><th class="num">原始填报</th><th class="num">当前生效量</th><th>状态 / 版本</th><th>操作</th></tr></thead><tbody>${a.map(p=>`<tr><td><strong>${esc(p.type==='online'?p.channel:p.period==='month'?p.province+'省区':p.customer)}</strong><small>${esc(p.type==='online'?'渠道负责人 · '+p.owner:p.center+' / '+p.region+' / '+p.province+' · '+p.owner)}</small></td><td>${esc(sku(p.sku).name)}<small>${p.sku} · ${sku(p.sku).pack}</small></td><td>${p.date}<small>${cyc(p.period)}</small></td><td class="num">${fmt(p.versions[0].qty)}</td><td class="num"><strong>${fmt(p.qty)}</strong>${p.adopt!==undefined?'<small>计划采用 '+fmt(p.adopt)+(p.receivedVersion!==p.version?' · 待接收新版':'')+'</small>':''}</td><td>${badge(p.status)}<small>V${p.version}</small></td><td><button class="link" onclick="detail(${p.id})">详情</button>${editable(p)?'<button class="link" onclick="edit('+p.id+')">填报</button>':''}${['已确认','已接收'].includes(p.status)&&isSales()?'<button class="link" onclick="adjust('+p.id+')">加急调整</button>':''}${role==='planner'&&p.status==='已确认'?'<button class="link" onclick="receive('+p.id+')">接收</button>':''}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">暂无符合条件的计划。</td></tr>'}</tbody></table></div><div class="foot"><span>共 ${a.length} 条</span><span>周期 / 业务线 / 填报对象 / SKU 唯一</span></div>`}
function aggregate(name,ids){let a=ids.map(get).filter(Boolean);modal('汇总来源 · '+name,`<div class="notice"><div>当前汇总 <b>${fmt(sum(a))} 箱</b> · 来源 ${a.length} 条<div class="muted">省区原始填报、审核阶段汇总快照与意见分别留存。审核人不直接修改原始数量。</div></div></div>${planTable(a)}<h3 style="margin-top:16px">各级审核汇总快照</h3><div class="muted">${a.flatMap(p=>p.logs.filter(l=>l.text.includes('整批')).map(l=>esc(l.at+' · '+l.who+' · '+l.text))).join('<br>')||'暂无审核快照；通过整批审核后留存。'}</div>`)}
function batchDialog(ids){let a=ids.map(get).filter(Boolean).filter(p=>isSales()?editable(p):p.status===target());if(!a.length)return toast('当前无可处理明细。');modal(isSales()?'确认整批提交':'审核整批计划',`<div class="notice"><div>本次处理 <b>${a.length} 条 · ${fmt(sum(a))} 箱</b><div class="muted">${a.map(p=>esc(p.customer||p.channel||p.province)+' / '+esc(sku(p.sku).name)).join('<br>')}</div></div></div><div class="field"><label>${isSales()?'提交说明':'审核意见（退回必填）'}</label><textarea id="batchReason" rows="3" placeholder="说明本批次的需求依据或退回原因。"></textarea></div><div id="formError" class="error" role="alert"></div>`,`<button onclick="closeModal()">取消</button>${!isSales()?'<button onclick="doBatch('+JSON.stringify(a.map(p=>p.id))+',true)">整批退回销售</button>':''}<button class="primary" onclick="doBatch(${JSON.stringify(a.map(p=>p.id))},false)">${isSales()?'确认提交':role==='yan'||role==='dan'?'确认本批计划':'通过并提交上一级'}</button>`)}
function doBatch(ids,back){let a=ids.map(get).filter(Boolean),reason=document.getElementById('batchReason').value.trim(),fail=t=>document.getElementById('formError').textContent=t;if(!a.length)return fail('没有可处理计划。');if(isSales()){if(!writable())return fail('已超出填报状态，不能提交。');if(a.some(p=>!editable(p)))return fail('计划状态已改变，请刷新。');if(a.some(p=>!eligible(p.sku,p.type,p.date)))return fail('有商品已停用、渠道不适用或不在生效期，不能提交。');if(a.some(p=>!p.qty&&!p.note.trim()))return fail('零需求必须说明原因。')}else{if(!target()||a.some(p=>p.status!==target()))return fail('只能处理当前审批节点的记录。');if(back&&!reason)return fail('请说明退回原因，让销售知道如何修改。')}let total=sum(a);for(let p of a){if(back){p.status='已退回';p.returnReason=reason}else if(isSales())p.status=p.type==='online'?'丹总待确认':'大区待审';else p.status={region:'中心待审',center:'严总待确认',yan:'已确认',dan:'已确认'}[role];log(p,(back?'整批退回':isSales()?'整批提交':'整批审核通过')+' · '+a.length+' 条 / '+fmt(total)+' 箱 · V'+p.version+' · '+(reason||'无补充意见'));}persist();closeModal();render();toast(back?'已整批退回，原始值与意见保留。':'处理完成，汇总快照与意见已保留。')}
function modal(title,body,foot=''){document.getElementById('overlay').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="dialog" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="dialoghead"><h2>${esc(title)}</h2><button class="link" aria-label="关闭" onclick="closeModal()">✕</button></div><div class="dialogbody">${body}</div><div class="dialogfoot">${foot||'<button onclick="closeModal()">关闭</button>'}</div></div></div>`}function closeModal(){document.getElementById('overlay').innerHTML=''}function field(label,html){return '<div class="field"><label>'+label+'</label>'+html+'</div>'}function eligible(code,t,date){let p=sku(code);return p.enabled&&p.channels.includes(t)&&date>=p.start&&date<=p.end}
function edit(id){let p=id?get(id):null;if(!isSales()||!writable()||p&&!editable(p))return toast('当前角色或周期状态不允许填报。');if(role==='sales'&&type!=='offline'||role==='online'&&type!=='online')return toast('请切换到本人负责的业务线。');let c=cycles[period],opts=db.products.filter(s=>s.enabled&&s.channels.includes(type)&&s.start<=c.end&&s.end>=c.start||p&&s.code===p.sku);if(!opts.length)return toast('本周期没有可用商品，请联系商品管理员。');modal(p?'编辑计划明细':'新增计划明细',`<div class="notice"><div><b>${kind(type)} · ${cyc(period)} · ${c.label}</b><div class="muted">${type==='offline'&&period==='month'?'最小单位为省区与商品，不要求填写客户。':type==='offline'?'最小单位为客户与商品，组织由账号归属带入。':'最小单位为线上渠道；商品作为需求明细和后续订单关联依据。'}</div></div></div><div class="formgrid">${field(type==='online'?'线上渠道 *':period==='month'?'省区 *':'客户 *',type==='online'?'<select id="fObject" '+(p?'disabled':'')+'>'+['天猫旗舰店','抖音官方店'].map(v=>'<option '+(p?.channel===v?'selected':'')+'>'+v+'</option>').join('')+'</select>':period==='month'?'<input id="fObject" value="湖北" disabled>':'<select id="fObject" '+(p?'disabled':'')+'>'+['武汉悦购商贸','宜昌优选食品','湖北惠选连锁'].map(v=>'<option '+(p?.customer===v?'selected':'')+'>'+v+'</option>').join('')+'</select>')}${field('可填报商品 *','<select id="fSku" '+(p?'disabled':'')+'>'+opts.map(s=>'<option value="'+s.code+'" '+(p?.sku===s.code?'selected':'')+'>'+s.name+'</option>').join('')+'</select>')}${field('销售总需求（箱） *','<input id="fQty" type="number" min="0" step="1" placeholder="填整数，含已下单需求" value="'+(p?.qty??'')+'">')}${field('需求交期 *','<input id="fDate" type="date" min="'+c.start+'" max="'+c.end+'" value="'+(p?.date||c.start)+'">')}</div><div class="field" style="margin-top:16px"><label>需求依据 / 异常说明</label><textarea id="fNote" rows="3">${esc(p?.note||'')}</textarea></div>${p?.returnReason?'<div class="alert">退回原因：'+esc(p.returnReason)+'</div>':''}<div class="row"><span class="muted">${type==='online'?'线上渠道负责人 · 林青':'休食 / 华中 / 湖北 · 李晓'} · 周期自动带入</span><button class="link" onclick="reference(${p?.id||0})">查看销售参考 →</button></div><div class="muted">参考数据不替代填报；同一对象与商品本周期只能填一条。保存后回工作台整批提交。</div><div id="formError" class="error" role="alert"></div>`,`<button onclick="closeModal()">取消</button><button class="primary" onclick="saveForm(${id||0})">保存明细</button>`)}
function saveForm(id){let p=id?get(id):null,fail=t=>document.getElementById('formError').textContent=t;if(!isSales()||!writable()||p&&!editable(p))return fail('当前权限或周期状态不允许修改。');const object=document.getElementById('fObject').value,code=document.getElementById('fSku').value,q=document.getElementById('fQty').value,qty=Number(q),date=document.getElementById('fDate').value,note=document.getElementById('fNote').value.trim();if(q===''||!Number.isInteger(qty)||qty<0)return fail('请输入大于或等于 0 的整数箱数。');if(date<cycles[period].start||date>cycles[period].end||!date)return fail('交期必须在当前计划周期内。');if(!eligible(code,type,date))return fail('商品未启用、不适用于本业务线或超出生效期。');if(qty===0&&!note)return fail('零需求请写明原因。');let duplicate=db.plans.some(x=>x.id!==id&&x.period===period&&x.type===type&&x.sku===code&&(type==='online'?x.channel===object:period==='month'?x.province===object&&x.region==='华中'&&x.center==='休食':x.customer===object&&x.province==='湖北'));if(duplicate)return fail('本周期已有相同对象与商品，请编辑原记录。');if(!p){p={id:Date.now(),period,type,center:type==='offline'?'休食':'',region:type==='offline'?'华中':'',province:type==='offline'?'湖北':'',customer:type==='offline'&&period==='week'?object:'',channel:type==='online'?object:'',owner:roles[role].name,sku:code,version:1,logs:[],versions:[]};db.plans.push(p)}else if(p.status==='已退回'){p.version++;p.returnReason=''}p.qty=qty;p.date=date;p.note=note;p.status='草稿';let snapshot={version:p.version,qty,reason:'销售草稿 / 重新填报'};let old=p.versions.findIndex(v=>v.version===p.version);if(old>=0)p.versions[old]=snapshot;else p.versions.push(snapshot);log(p,'保存 V'+p.version+' · '+fmt(qty)+' 箱');persist();closeModal();render();toast('明细已保存，请在工作台整批提交。')}
function detail(id){let p=get(id);if(!p)return;let related=db.orders.filter(o=>o.plan===p.id),changes=db.changes.filter(c=>c.plan===id);modal('计划详情 · V'+p.version,`<div class="heading"><div><h2>${esc(p.customer||p.channel||p.province+'省区')}</h2><div class="muted">${cyc(p.period)} · ${cycles[p.period].label} · ${kind(p.type)}</div></div>${badge(p.status)}</div><div class="row"><b>${sku(p.sku).name}</b><b>${fmt(p.qty)} 箱</b></div><div class="row"><span>交期</span><span>${p.date}</span></div><div class="notice"><div><b>销售依据</b><br>${esc(p.note)}${p.returnReason?'<br>退回原因：'+esc(p.returnReason):''}</div></div>${p.adopt!==undefined?'<div class="alert">计划采用 '+fmt(p.adopt)+' 箱 · 接收 V'+p.receivedVersion+(p.receivedVersion!==p.version?' · 存在新版本，需要重新接收':'')+'<br>'+esc(p.planNote)+'</div>':''}<div class="tabs"><button onclick="reference(${p.id})">历史销售</button><button onclick="planOrders(${p.id})">关联订单 ${related.length} 条</button>${isSales()&&['已确认','已接收'].includes(p.status)?'<button onclick="adjust('+id+')">发起加急调整</button>':''}</div><h3 style="margin-top:22px">版本变化（历史不覆盖）</h3><div class="tablewrap"><table><thead><tr><th>版本</th><th>数量</th><th>原因</th></tr></thead><tbody>${p.versions.map(v=>'<tr><td>V'+v.version+'</td><td>'+fmt(v.qty)+' 箱</td><td>'+esc(v.reason)+'</td></tr>').join('')}</tbody></table></div><h3 style="margin-top:18px">调整记录</h3><div class="muted">${changes.map(c=>c.id+' · '+badge(c.state)+' · '+fmt(c.before)+' → '+fmt(c.after)+' 箱 · '+esc(c.reason)).join('<br>')||'暂无加急调整。'}</div><h3 style="margin-top:18px">操作与审核记录</h3><div class="muted">${p.logs.map(l=>'<div style="padding:8px 0;border-bottom:1px solid var(--line)">'+esc(l.at+' · '+l.who)+'<br>'+esc(l.text)+'</div>').join('')||'示例初始数据，暂无完整操作历史。'}</div>`)}

function refData(p){if(p?.customer==='宜昌优选食品')return null;let factor=refRange==='近3个月'?3:refRange==='近2个月'?2:1;let q=p?.qty||3200;return [Math.round(q*.63*factor),Math.round(q*.70*factor),Math.round(q*.81*factor)]}function reference(id=0){let p=id?get(id):visible()[0];if(id&&!p)return;let opts=(p?.type||type)==='online'?['按周','按月']:['近1个月','近2个月','近3个月','自定义'];if(!opts.includes(refRange))refRange=opts[0];modal('历史销售参考',`<div class="muted">${p?esc(p.customer||p.channel||p.province)+' · '+sku(p.sku).name:'当前范围'} · 来源 ${type==='online'?'旺店通':'OMS'} · 示例快照 2026-10-14 10:00</div><div class="toolbar" style="padding-left:0"><select id="refRange" aria-label="历史参考范围" onchange="refRange=this.value;reference(${id})">${opts.map(x=>'<option '+(x===refRange?'selected':'')+'>'+x+'</option>').join('')}</select>${refRange==='自定义'?'<input id="refStart" aria-label="参考开始日期" type="date" value="2026-09-01"><input id="refEnd" aria-label="参考结束日期" type="date" value="2026-09-30"><button onclick="drawCustomRef()">查询</button>':''}</div><div id="refBody">${referenceBody(p)}</div><div class="muted">有效已履约订单示例数量，剔除取消；实际退款、退货、换货回冲规则待业务确认。此处历史数据不参与自动替代销售填报。</div>`,(id&&editable(p)?'<button onclick="closeModal()">返回填报</button>':'')+'<button onclick="closeModal()">关闭</button>')}

function adjust(id){if(!isSales())return;let options=visible().filter(p=>['已确认','已接收'].includes(p.status)&&!db.changes.some(c=>c.plan===p.id&&c.state==='OA 待审批'));if(!options.length)return toast('没有可调整的确认计划，或已有待审批申请。');let p=id?get(id):options[0];if(!options.some(x=>x.id===p?.id))return toast('该计划尚未确认或已有待审批申请。');modal('发起 OA 加急调整',`<div class="notice"><div>审批人自动路由：<b>${type==='online'?'丹总':'严总'}</b><div class="muted">审批通过前原计划不变。仅调整数量，商品和对象变更需另行申请。</div></div></div><div class="field"><label>原始计划明细 *</label><select id="adjPlan" onchange="let chosen=Number(this.value);closeAll();adjust(chosen)">${options.map(x=>'<option value="'+x.id+'" '+(x.id===p.id?'selected':'')+'>'+esc(x.customer||x.channel||x.province)+' · '+sku(x.sku).name+' · V'+x.version+' · '+fmt(x.qty)+' 箱</option>').join('')}</select></div><div class="formgrid" style="margin-top:16px">${field('调整类型 *','<select id="direction"><option value="up">加急增加数量</option><option value="down">加急减少数量</option></select>')}${field('增加 / 减少数量（箱） *','<input id="delta" type="number" min="1" step="1" placeholder="请输入正整数">')}</div><div class="field" style="margin-top:16px"><label>调整原因 *</label><textarea id="adjReason" rows="3" placeholder="说明产品变化、客户变化或其他外部原因。"></textarea></div><div class="field" style="margin-top:12px"><label>必要附件（按实际业务提供）</label><input id="attachment" type="file" multiple><div class="muted">原型仅保留文件名，不上传或保存文件内容；真实 OA 需上传并保存附件引用。</div></div><div id="formError" class="error" role="alert"></div>`,`<button onclick="closeModal()">取消</button><button class="primary" onclick="submitAdjustment()">提交 OA（模拟）</button>`)}
function submitAdjustment(){let p=get(Number(document.getElementById('adjPlan').value)),up=document.getElementById('direction').value==='up',val=document.getElementById('delta').value,n=Number(val),reason=document.getElementById('adjReason').value.trim(),fail=t=>document.getElementById('formError').textContent=t;if(!p||!isSales()||!['已确认','已接收'].includes(p.status)||db.changes.some(c=>c.plan===p.id&&c.state==='OA 待审批'))return fail('该计划不可调整或已有待审批申请。');if(val===''||!Number.isInteger(n)||n<=0)return fail('增减数量需为正整数。');if(!up&&n>p.qty)return fail('减少量不能超过原计划量。');if(!reason)return fail('请填写调整原因。');const c={id:'OA-'+Date.now(),plan:p.id,baseVersion:p.version,before:p.qty,delta:up?n:-n,after:p.qty+(up?n:-n),direction:up?'加急增加':'加急减少',reason,attachments:[...document.getElementById('attachment').files].map(f=>f.name),at:stamp(),who:roles[role].name,approver:p.type==='online'?'丹总':'严总',state:'OA 待审批',result:''};db.changes.push(c);log(p,'提交模拟 OA '+c.id+' · '+c.direction+' '+n+' 箱');persist();closeModal();page='changes';render();toast('模拟 OA 已提交，原计划保持不变。')}
function changeDetail(id){let c=db.changes.find(x=>x.id===id),p=c&&get(c.plan);if(!p)return;let allowed=c.state==='OA 待审批'&&(role==='yan'&&p.type==='offline'||role==='dan'&&p.type==='online');modal('加急申请 · '+c.id,`<div class="row"><b>${esc(p.customer||p.channel||p.province)} · ${sku(p.sku).name}</b>${badge(c.state)}</div><div class="notice"><div>基于 V${c.baseVersion} · ${fmt(c.before)} 箱 → ${fmt(c.after)} 箱<br>差异 ${c.delta>0?'+':''}${fmt(c.delta)} 箱 · ${c.approver}审批</div></div><p>原因：${esc(c.reason)}</p><div class="muted">发起人：${esc(c.who)} · ${esc(c.at)}<br>附件名称：${c.attachments.map(esc).join('、')||'未提供'}（原型未保存附件内容）<br>${c.result?'审批结果：'+esc(c.result)+' · '+esc(c.reviewedAt):''}</div>${allowed?'<div class="field" style="margin-top:18px"><label>审批意见（驳回必填）</label><textarea id="oaReason" rows="3"></textarea></div>':''}<div id="formError" class="error" role="alert"></div>`,`<button onclick="closeModal()">关闭</button>${allowed?'<button onclick="reviewChange(\''+id+'\',false)">驳回</button><button class="primary" onclick="reviewChange(\''+id+'\',true)">批准并生成新版本</button>':''}`)}
function reviewChange(id,pass){let c=db.changes.find(x=>x.id===id),p=c&&get(c.plan),reason=document.getElementById('oaReason').value.trim(),fail=t=>document.getElementById('formError').textContent=t;if(!p||c.state!=='OA 待审批'||!(role==='yan'&&p.type==='offline'||role==='dan'&&p.type==='online'))return fail('无权审批此申请。');if(!pass&&!reason)return fail('请填写驳回原因。');if(pass&&(p.version!==c.baseVersion||p.qty!==c.before))return fail('原计划版本已改变，请重新发起调整。');c.state=pass?'已通过':'已驳回';c.result=reason||(pass?'批准调整':'');c.reviewedAt=stamp();if(pass){p.version++;p.qty=c.after;p.status='已确认';p.versions.push({version:p.version,qty:p.qty,reason:c.direction+' · '+c.reason+' · '+c.id});log(p,'模拟 OA 通过 · V'+p.version+' · '+fmt(p.qty)+' 箱；计划部门需接收新版本')}else log(p,'模拟 OA 驳回 · '+c.id+' · '+reason);persist();closeModal();render();toast(pass?'已生成新版本；计划部门需要重新接收。':'已驳回，原计划版本与数量保持不变。')}
function relevantOrders(){return db.orders.filter(o=>o.period===period&&o.type===type&&canSee(o))}function actual(p){let a=db.orders.filter(o=>o.plan===p.id&&o.state==='已履约');return sum(a)-sum(a,'returns')}function achieved(p){return p.qty>0?(actual(p)/p.qty*100).toFixed(1)+'%':'—'}function analysis(){if(type==='offline'&&period==='month'&&dimension==='客户')return monthlyCustomers();let a=visible().filter(p=>['已确认','已接收'].includes(p.status)),total=sum(a),real=a.reduce((s,p)=>s+actual(p),0);return title('达成分析与计划归档','月度与周度独立查看，可从汇总下钻到计划和销售订单。','<button onclick="exportPlans()">↓ 导出计划</button>')+`<div class="alert">达成口径待确认：月周订单能否同时计入、取消 / 退款 / 退货 / 换货如何回冲。此处为预览口径“已履约数量 − 示例退货数量”，未连接真实销售数据。归档周期内数据为模拟完成样本，不代表实际已发生销售。</div><div class="stats">${stat('确认计划量',fmt(total),'以当前生效确认版本为分母','箱')}${stat('实际完成预览',fmt(real),'示例履约量扣减示例退货','箱')}${stat('差异：实际 − 计划',fmt(real-total),'负数表示尚未兑现','箱')}${stat('达成率预览',total?(real/total*100).toFixed(1)+'%':'—','零计划量显示 —，不除以零')}</div><div class="card"><div class="cardhead"><h2>按维度汇总</h2><select aria-label="分析维度" onchange="dimension=this.value;render()">${(type==='online'?['渠道','商品']:['中心','大区','省区','客户','商品']).map(x=>'<option '+(dimension===x?'selected':'')+'>'+x+'</option>').join('')}</select></div><div class="tablewrap"><table><thead><tr><th>分析对象</th><th class="num">确认计划量</th><th class="num">实际完成量</th><th class="num">差异量</th><th>达成率</th><th>下钻</th></tr></thead><tbody>${group(a,p=>dimension==='商品'?sku(p.sku).name:dimension==='渠道'?p.channel:dimension==='中心'?p.center:dimension==='大区'?p.region:dimension==='省区'?p.province:p.customer||'月计划不含客户').map(([k,x])=>{let t=sum(x),r=x.reduce((s,p)=>s+actual(p),0);return '<tr><td>'+esc(k)+'</td><td class="num">'+fmt(t)+'</td><td class="num">'+fmt(r)+'</td><td class="num">'+fmt(r-t)+'</td><td>'+(t?(r/t*100).toFixed(1)+'%':'—')+'</td><td><button class="link" onclick="drill('+JSON.stringify(x.map(p=>p.id))+')">计划 → 订单</button></td></tr>'}).join('')||'<tr><td colspan="6" class="empty">当前范围没有确认计划。</td></tr>'}</tbody></table></div></div><div class="card"><div class="cardhead"><h2>已完成计划归档 · 演示样本</h2><span class="muted">月 / 周分开关联 · 不合计两个周期</span></div><div class="tablewrap"><table><thead><tr><th>归档对象</th><th>当前版本</th><th>已关联订单</th><th>达成率预览</th><th>操作</th></tr></thead><tbody>${a.filter(p=>db.orders.some(o=>o.plan===p.id)).map(p=>'<tr><td>'+esc(p.customer||p.channel||p.province)+' / '+sku(p.sku).name+'</td><td>V'+p.version+'</td><td>'+db.orders.filter(o=>o.plan===p.id).length+' 条</td><td>'+achieved(p)+'</td><td><button class="link" onclick="planOrders('+p.id+')">查看订单</button><button class="link" onclick="detail('+p.id+')">版本记录</button></td></tr>').join('')||'<tr><td colspan="5" class="empty">暂无示例完成计划。</td></tr>'}</tbody></table></div></div>`}
function drill(ids){let a=ids.map(get).filter(Boolean);modal('达成分析下钻',`<div class="tablewrap"><table><thead><tr><th>计划对象 / 商品</th><th>计划量</th><th>实际完成</th><th>达成率</th><th>订单明细</th></tr></thead><tbody>${a.map(p=>'<tr><td>'+esc(p.customer||p.channel||p.province)+'<small>'+sku(p.sku).name+'</small></td><td>'+fmt(p.qty)+'</td><td>'+fmt(actual(p))+'</td><td>'+achieved(p)+'</td><td><button class="link" onclick="planOrders('+p.id+')">关联订单 →</button></td></tr>').join('')}</tbody></table></div>`)}
function orderTable(a){return `<div class="tablewrap"><table><thead><tr><th>订单 / 明细号</th><th>客户 / 渠道</th><th>商品 / 日期</th><th class="num">履约量</th><th class="num">退货预览</th><th>关联状态 / 来源</th><th>操作</th></tr></thead><tbody>${a.map(o=>'<tr><td><strong>'+o.id+'</strong><small>明细 '+o.line+'</small></td><td>'+esc(o.customer||o.channel)+'</td><td>'+sku(o.sku).name+'<small>'+o.date+'</small></td><td class="num">'+fmt(o.qty)+'</td><td class="num">'+fmt(o.returns)+'</td><td>'+badge(o.plan?'已关联':'匹配异常')+'<small>'+o.source+' · '+esc(o.reason)+'</small></td><td>'+(o.plan?'<button class="link" onclick="detail('+o.plan+')">所属计划 →</button>':role==='admin'?'<button class="link" onclick="matchOrder(\''+o.id+'\')">处理异常</button>':'<span class="muted">由管理员处理</span>')+'</td></tr>').join('')||'<tr><td colspan="7" class="empty">暂无关联订单；数据缺失不表示实际销量为零。</td></tr>'}</tbody></table></div>`}function planOrders(id){let p=get(id);if(!p)return;modal('关联订单 · '+(p.customer||p.channel||p.province),`<div class="notice"><div>${cyc(p.period)} · ${cycles[p.period].label} · V${p.version}<br>计划 ${fmt(p.qty)} 箱 · 实际完成预览 ${fmt(actual(p))} 箱 · ${achieved(p)}</div></div>${orderTable(db.orders.filter(o=>o.plan===id))}<div class="muted">从订单可返回所属计划；本预览按示例净履约量计算，正式统计口径待确认。</div>`)}
function orders(){let a=relevantOrders();return title('订单关联与异常处理','按周期、业务线、组织或渠道、客户与商品匹配；人工处理不能跨范围关联。',role==='admin'?'<button class="primary" onclick="autoMatch()">运行自动匹配（模拟）</button>':'')+`<div class="stats">${stat('订单明细',a.length,'来源订单号 + 明细号唯一','条')}${stat('已关联',a.filter(o=>o.plan).length,'可从订单查看所属计划','条')}${stat('匹配异常',a.filter(o=>!o.plan).length,'仅管理员可处理','条')}${stat('数据来源',type==='online'?'旺店通':'OMS','原型使用模拟订单快照')}</div><div class="notice"><div><b>匹配规则</b>　${type==='online'?'周期 + 线上类型 + 渠道 + 商品':period==='month'?'周期 + 线下类型 + 中心 / 大区 / 省区 + 商品':'周期 + 线下类型 + 中心 / 大区 / 省区 + 客户 + 商品'}<div class="muted">只匹配已确认 / 已接收计划。同一明细在同一周期维度只关联一次；月周能否双计尚待确认。</div></div></div><div class="card"><div class="cardhead"><h2>本周期订单快照</h2><span class="muted">演示数据 · 非实时同步</span></div>${orderTable(a)}</div><div class="alert">取消、退款、退货与换货如何回冲待确认。当前订单数据不参与真实经营统计，统计范围和更新时间应在接入正式订单系统后展示。</div>`}
function candidates(o){return db.plans.filter(p=>p.period===o.period&&p.type===o.type&&p.sku===o.sku&&['已确认','已接收'].includes(p.status)&&o.date>=cycles[p.period].start&&o.date<=cycles[p.period].end&&(p.type==='online'?p.channel===o.channel:p.center===o.center&&p.region===o.region&&p.province===o.province&&(p.period==='month'||p.customer===o.customer)))}function autoMatch(){if(role!=='admin')return;let n=0;for(let o of relevantOrders().filter(o=>!o.plan)){let ps=candidates(o);if(ps.length===1){o.plan=ps[0].id;o.reason='自动匹配 · '+stamp();n++}else o.reason=ps.length?'多条候选，需要管理员核查':'无匹配的确认计划'}persist();render();toast('模拟自动匹配完成，新增关联 '+n+' 条。')}
function matchOrder(id){let o=relevantOrders().find(x=>x.id===id);if(role!=='admin'||!o||o.plan)return;let ps=candidates(o);modal('处理订单匹配异常',`<div class="notice"><div>${o.id} / ${o.line} · ${esc(o.customer||o.channel)} · ${sku(o.sku).name}<div class="muted">${esc(o.reason)}；仅允许关联满足周期、业务线、组织 / 渠道、客户和商品条件的确认计划。</div></div></div>${ps.length?'<div class="field"><label>候选确认计划</label><select id="matchPlan">'+ps.map(p=>'<option value="'+p.id+'">'+esc(p.customer||p.channel||p.province)+' · V'+p.version+' · '+fmt(p.qty)+' 箱</option>').join('')+'</select></div><div class="field" style="margin-top:12px"><label>人工关联原因 *</label><textarea id="matchReason" rows="2"></textarea></div>':'<div class="empty">暂无符合规则的确认计划。<br><small>请核查客户 / SKU 映射，或待销售计划确认后重新运行自动匹配。不能关联不相符计划。</small></div>'}<div id="formError" class="error" role="alert"></div>`,`<button onclick="closeModal()">关闭</button>${ps.length?'<button class="primary" onclick="doMatch(\''+id+'\')">保存人工关联</button>':''}`)}function doMatch(id){let o=relevantOrders().find(x=>x.id===id),p=get(Number(document.getElementById('matchPlan').value)),reason=document.getElementById('matchReason').value.trim();if(role!=='admin'||!o||!p||!candidates(o).some(x=>x.id===p.id))return;if(!reason)return document.getElementById('formError').textContent='请填写人工关联原因。';o.plan=p.id;o.reason='人工关联：'+reason+' · '+stamp();log(p,'管理员关联订单 '+o.id+'：'+reason);persist();closeModal();render();toast('订单已关联，处理原因已留存。')}
function products(){return title('可填报商品维护','启用状态、适用业务线和生效时间共同控制填报；停用不影响历史计划。',role==='admin'?'<button class="primary" onclick="productEdit()">＋ 新增商品范围</button>':'')+notice(role==='admin'?'维护商品编码、适用渠道和生效区间；停用时保留变更记录。':'查看可填报商品；需要新增或停用时联系商品管理员。')+`<div class="card"><div class="cardhead"><h2>商品范围</h2><span class="muted">${role==='admin'?'管理员可维护':'当前只读'}</span></div><div class="tablewrap"><table><thead><tr><th>编码 / 名称</th><th>箱规</th><th>适用业务线</th><th>启用状态</th><th>生效 / 失效时间</th><th>操作</th></tr></thead><tbody>${db.products.map(p=>'<tr><td><strong>'+p.name+'</strong><small>'+p.code+'</small></td><td>'+p.pack+'</td><td>'+p.channels.map(kind).join(' / ')+'</td><td>'+badge(p.enabled?'已启用':'已停用')+'</td><td>'+p.start+'<small>至 '+p.end+'</small></td><td><button class="link" onclick="productHistory(\''+p.code+'\')">变更记录</button>'+(role==='admin'?'<button class="link" onclick="productEdit(\''+p.code+'\')">维护</button>':'')+'</td></tr>').join('')}</tbody></table></div></div><div class="alert">新填报和提交时均检查商品范围。跨期生效商品按需求交期校验；若商品停用影响已确认执行，需要走加急调整并协调产品变更，不覆盖历史计划。</div>`}
function productEdit(code){if(role!=='admin')return;let p=code?sku(code):null;modal(p?'维护可填报商品':'新增可填报商品',`<div class="formgrid">${field('商品编码 *','<input id="skuCode" '+(p?'disabled':'')+' value="'+esc(p?.code||'')+'">')}${field('商品名称 *','<input id="skuName" '+(p?'disabled':'')+' value="'+esc(p?.name||'')+'">')}${field('箱规 *','<input id="skuPack" '+(p?'disabled':'')+' value="'+esc(p?.pack||'')+'" placeholder="例如：20 袋 / 箱">')}${field('启用状态','<select id="skuEnabled"><option value="yes" '+(p?.enabled?'selected':'')+'>启用</option><option value="no" '+(p&&!p.enabled?'selected':'')+'>停用</option></select>')}${field('生效时间 *','<input id="skuStart" type="date" value="'+(p?.start||'2026-10-01')+'">')}${field('失效时间 *','<input id="skuEnd" type="date" value="'+(p?.end||'2027-12-31')+'">')}</div><div class="field" style="margin-top:16px"><label>适用业务线 *</label><label><input id="skuOffline" type="checkbox" '+(!p||p.channels.includes('offline')?'checked':'')+'> 线下</label><label><input id="skuOnline" type="checkbox" '+(!p||p.channels.includes('online')?'checked':'')+'> 线上</label></div><div class="field"><label>变更原因 *</label><textarea id="skuReason" rows="2"></textarea></div><div class="muted">已有商品的名称与箱规由商品主数据管理，避免改动历史快照；此处只维护计划准入范围。</div><div id="formError" class="error" role="alert"></div>`,`<button onclick="closeModal()">取消</button><button class="primary" onclick="saveProduct('${code||''}')">保存范围</button>`)}function saveProduct(code){if(role!=='admin')return;let c=document.getElementById('skuCode').value.trim(),name=document.getElementById('skuName').value.trim(),pack=document.getElementById('skuPack').value.trim(),start=document.getElementById('skuStart').value,end=document.getElementById('skuEnd').value,enabled=document.getElementById('skuEnabled').value==='yes',channels=['offline','online'].filter(x=>document.getElementById(x==='offline'?'skuOffline':'skuOnline').checked),reason=document.getElementById('skuReason').value.trim(),fail=t=>document.getElementById('formError').textContent=t;if(!c||!name||!pack||!start||!end||start>end||!channels.length||!reason)return fail('请完整填写必填项，至少选择一个业务线，日期范围须有效。');if(!code&&db.products.some(x=>x.code===c))return fail('商品编码已存在。');let p=code?sku(code):{code:c,name,pack,log:[]};let before=code?JSON.stringify({enabled:p.enabled,channels:p.channels,start:p.start,end:p.end}):'新建';Object.assign(p,{start,end,enabled,channels});p.log.push({who:roles[role].name,at:stamp(),text:before+' → '+JSON.stringify({enabled,channels,start,end})+'；原因：'+reason});if(!code)db.products.push(p);persist();closeModal();render();toast('商品范围已保存，变更记录已留存。')}function productHistory(code){let p=sku(code);modal('商品变更记录 · '+p.name,'<div class="muted">'+(p.log.map(l=>'<div style="padding:12px 0">'+esc(l.at+' · '+l.who)+'<br>'+esc(l.text)+'</div>').join('')||'初始示例配置，暂无变更。')+'</div>')}
function rules(){return title('角色与业务规则','按会议纪要调整，未决口径明确留待确认。',role==='admin'?'<button onclick="configDialog()">待确认配置</button>':'')+`<div class="card"><div class="cardhead"><h2>月周计划与双线审核</h2></div><div class="tablewrap"><table><thead><tr><th>规则</th><th>线下月计划</th><th>线下周计划</th><th>线上月 / 周计划</th></tr></thead><tbody><tr><td>填报单位</td><td>省区 × 商品</td><td>省区下客户 × 商品</td><td>渠道，商品作为计划明细</td></tr><tr><td>组织流转</td><td colspan="2">省区提交 → 大区汇总审核 → 中心汇总审核 → 严总确认</td><td>渠道填报 → 丹总确认</td></tr><tr><td>销售参考</td><td colspan="2">OMS · 近 1 / 2 / 3 个月 / 自定义范围</td><td>旺店通 · 按周 / 月历史销售</td></tr><tr><td>加急审批</td><td colspan="2">OA → 严总</td><td>OA → 丹总</td></tr><tr><td>达成分析</td><td colspan="2">中心 / 大区 / 省区 / 客户 / 商品；月计划不含客户，客户维度由订单下钻</td><td>渠道 / 商品</td></tr></tbody></table></div></div><div class="card"><div class="cardhead"><h2>角色能看什么、要做什么、边界在哪里</h2></div><div class="tablewrap"><table><thead><tr><th>角色</th><th>可见范围</th><th>主要责任</th><th>操作边界</th></tr></thead><tbody>${Object.entries(roles).map(([r,m])=>'<tr><td>'+m.label+'</td><td>'+m.scope+'</td><td>'+m.todo+'</td><td>'+({sales:'只编辑可填报期的草稿 / 退回；确认后走调整',online:'只管理本人渠道；不自审',region:'只审大区待审，不能改省区原始值',center:'只审中心待审，不跨中心审核',yan:'确认线下计划，审批线下加急',dan:'确认线上计划，审批线上加急',planner:'只接收确认版本，采用量与销售量分开',admin:'商品范围与异常订单处理，不代替业务审批'}[r])+'</td></tr>').join('')}</tbody></table></div></div><div class="grid"><div class="card padded"><h2>截止与版本控制</h2><ol class="rules"><li>未开始：提前预警与准备；可填报 / 即将截止：允许填报；已截止后禁止直接保存或提交。</li><li>审核中与已确认均只读；已提交记录不可直接修改。审核退回后，在允许填报期修改并重新整批提交。</li><li>截止后补报需授权或调整流程。原型不放行无授权补报；已确认记录可走加急调整。</li><li>加急增加 / 减少经 OA 审批。通过生成新版本；驳回不改变原计划。历史版本、原因、审批结果保留。</li><li>计划部门接收过的记录调整后需重新接收，避免继续使用旧版本。</li></ol></div><div class="card padded"><h2>待业务确认的口径</h2><ul class="rules"><li>月计划开放日期与截止时点；周五前的精确截止时间。</li><li>订单是否可同时计入月计划与周计划；两个维度不能简单相加。</li><li>取消、退款、退货、换货的净完成量规则及回冲日期。</li><li>线上按渠道管理，原型增加商品明细以支持商品分析；具体粒度需确认。</li><li>完成归档触发条件、截止后补报授权人和 OA 附件要求。</li></ul><button onclick="configDialog()">查看 / 维护待确认配置</button></div></div><div class="card padded"><h2>正式接入与第一阶段交付边界</h2><p class="muted">本 HTML 是本地交互原型，未连接 OMS、旺店通或 OA。正式系统需后端校验账号权限、周期、版本并发与幂等审批；订单按来源 + 原订单号 + 明细号去重，跨系统同源订单去重；缺失销售数据不可记为零。生产排程、工单下达、库存与产能抵扣仍属于后续模块。</p></div>`}
function configDialog(){let edit=role==='admin';modal('待确认业务配置',`<div class="alert">以下配置记录讨论结果，原型的日期控制仍通过“演示周期状态”验证。正式系统需由配置驱动服务端时间校验。当前未确认项保持为空或“待确认”。</div><div class="formgrid">${field('月计划开放日期规则','<input id="cfgOpen" '+(!edit?'disabled':'')+' value="'+esc(db.config.monthlyOpen)+'" placeholder="待确认，例如每月 20 日 09:00">')}${field('月计划截止时点','<input id="cfgMonthClose" '+(!edit?'disabled':'')+' value="'+esc(db.config.monthlyClose)+'" placeholder="待确认">')}${field('周计划精确截止时点','<input id="cfgWeekClose" '+(!edit?'disabled':'')+' value="'+esc(db.config.weeklyClose)+'" placeholder="待确认：周五前的准确时间">')}${field('月 / 周订单计入口径','<input id="cfgOverlap" '+(!edit?'disabled':'')+' value="'+esc(db.config.overlap)+'">')}${field('退款 / 退货 / 换货回冲规则','<input id="cfgReturns" '+(!edit?'disabled':'')+' value="'+esc(db.config.returns)+'">')}</div><div class="muted" style="margin-top:12px">${edit?'管理员可记录确认结果；不会自动改变示例统计。':'仅管理员可维护。'}</div>`,`<button onclick="closeModal()">关闭</button>${edit?'<button class="primary" onclick="saveConfig()">保存讨论结果</button>':''}`)}function saveConfig(){if(role!=='admin')return;db.config={monthlyOpen:document.getElementById('cfgOpen').value.trim(),monthlyClose:document.getElementById('cfgMonthClose').value.trim(),weeklyClose:document.getElementById('cfgWeekClose').value.trim(),overlap:document.getElementById('cfgOverlap').value.trim()||'待确认',returns:document.getElementById('cfgReturns').value.trim()||'待确认'};persist();closeModal();toast('讨论结果已记录，示例日期和统计口径未自动改变。')}
function exportPlans(){let a=visible(),h=['计划维度','周期','业务线','中心','大区','省区','客户','渠道','SKU','原始量','生效量','交期','状态','版本','实际完成预览','备注'];let lines=[h,...a.map(p=>[cyc(p.period),cycles[p.period].key,kind(p.type),p.center,p.region,p.province,p.customer,p.channel,p.sku,p.versions[0].qty,p.qty,p.date,p.status,p.version,actual(p),p.note])];let blob=new Blob(['\ufeff'+lines.map(l=>l.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),aTag=document.createElement('a');aTag.href=URL.createObjectURL(blob);aTag.download='脱骨侠-'+cycles[period].key+'-'+kind(type)+'-示例计划.csv';aTag.click();setTimeout(()=>URL.revokeObjectURL(aTag.href),1000);toast('已导出当前角色可见范围，统计量为示例预览。')}
function resetDemo(){modal('重置会议版演示数据','清除本原型的本地填报、审批、调整和商品维护记录，恢复示例。','<button onclick="closeModal()">取消</button><button class="primary" onclick="db=seed();persist();closeModal();render();toast(\'已重置会议版示例\')">确认重置</button>')}

function monthlyCustomers(){let a=visible().filter(p=>['已确认','已接收'].includes(p.status)),os=relevantOrders().filter(o=>a.some(p=>p.id===o.plan));return title('达成分析与计划归档','月度省区计划没有客户目标，不强行拆分客户计划量。')+'<div class="alert">客户维度仅展示已关联月计划的实际销售；月计划的计划量与达成率保留在省区 / 商品维度。订单回冲规则待确认，以下为模拟净履约量。</div><div class="card"><div class="cardhead"><h2>月计划按客户下钻</h2><select aria-label="分析维度" onchange="dimension=this.value;render()">'+['中心','大区','省区','客户','商品'].map(x=>'<option '+(dimension===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="tablewrap"><table><thead><tr><th>客户</th><th>客户目标量</th><th>实际完成预览</th><th>达成率</th><th>下钻</th></tr></thead><tbody>'+group(os,o=>o.customer).map(([k,x])=>'<tr><td>'+esc(k)+'</td><td>— · 月计划未拆客户目标</td><td>'+fmt(sum(x)-sum(x,'returns'))+' 箱</td><td>—</td><td><button class="link" onclick="customerOrders('+JSON.stringify(x.map(o=>o.id)).replaceAll('"','&quot;')+')">订单明细 →</button></td></tr>').join('')+'</tbody></table></div></div>'}
function customerOrders(ids){modal('客户销售订单下钻',orderTable(relevantOrders().filter(o=>ids.includes(o.id))))}

// Keep entered form values while opening a reference or detail in a second dialog.
let dialogStack=[];const baseModal=modal,baseClose=closeModal;
modal=function(t,b,f){let current=document.querySelector('.dialog');if(current)dialogStack.push(document.getElementById('overlay').firstElementChild);baseModal(t,b,f)};
closeModal=function(){if(dialogStack.length){document.getElementById('overlay').replaceChildren(dialogStack.pop())}else baseClose()};
function closeAll(){dialogStack=[];baseClose()}
// Mutating actions return to the refreshed work page, without stale dialogs.
for(const action of ['saveForm','doBatch','doReceive','submitAdjustment','reviewChange','saveProduct','doMatch']){
 const fn=({saveForm,doBatch,doReceive,submitAdjustment,reviewChange,saveProduct,doMatch})[action];
 const wrapped=function(...args){const before=JSON.stringify(db);fn(...args);if(JSON.stringify(db)!==before)closeAll()};
 if(action==='saveForm')saveForm=wrapped;if(action==='doBatch')doBatch=wrapped;if(action==='doReceive')doReceive=wrapped;if(action==='submitAdjustment')submitAdjustment=wrapped;if(action==='reviewChange')reviewChange=wrapped;if(action==='saveProduct')saveProduct=wrapped;if(action==='doMatch')doMatch=wrapped;
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();
</script></body></html>
