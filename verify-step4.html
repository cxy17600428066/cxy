<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verify Step 4</title>
<style>html,body{margin:0;height:100%;background:#f3ece3}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="preview" src="./全渠道商品内容平台-PC工作台.html"></iframe>
<script>
const frame=document.getElementById("preview");
frame.addEventListener("load",()=>{
  const win=frame.contentWindow;
  win.eval(`
    setSelectedProducts(["p1","p2"]);
    const s=scenes.distributor;
    state.scene="distributor";
    $("sceneName").textContent=s.name;
    state.manualTitle=s.title;
    state.manualSummary=s.summary;
    state.stat1=s.stats[0];
    state.stat2=s.stats[1];
    state.stat3=s.stats[2];
    state.shareMode="分享链接";
    state.tags=s.tags;
    state.caps=s.caps.map(i=>\`\${i[0]} | \${i[1]} | \${i[2]}\`).join("\\n");
    fillForm();
    renderProductEditors();
    renderNav();
    renderPreview();
    go(4);
  `);
});
</script>
</body>
</html>
